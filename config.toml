# Modify this configuration file directly when using the CLI, or via the menu on the left in the GUI app

[search]
device_family = "iphone_duo"        # the device family, or a list of families
models = ["MK1E4LL/A", "MK1F4LL/A"] # iPhone Duo 256GB: Star White, Night Sky
carriers = ["UNLOCKED/US"]          # the carriers, if applicable
country_code = "us"                 # the country code
zip_code = "20715"                  # the zip-code area, can be left empty to use specific stores
stores = []                         # store-codes to search, can be left empty when using zip-code

[general]
polling_interval_seconds = 120 # recommended to make it > 10 seconds to account for processing time, make it > 30 when using random proxies
report_after_n_counts = 30     # after how many times a report should be generated
data_path = "data.csv"
log_path = "log.txt"
randomize_proxies = false

[ntfy]
server = "https://ntfy.sh" # ntfy server, change if self-hosting
topic = ""                  # your ntfy topic (anyone who knows it can read it, pick something hard to guess)

# Notification preferences for ntfy
[notifications]
on_start = false                  # Notify when monitoring starts
on_stop = false                   # Notify when monitoring stops
on_stock_available = true        # Notify when stock is available
on_appointment_available = false  # Notify when appointment is available
on_newly_available = false        # Notify when newly available stock is detected
on_auto_report = false            # Notify with auto-generated reports
on_proxy_depletion = false        # Notify when proxies are depleted
on_long_processing_warning = false # Notify when processing takes too long
on_connection_error = true       # Notify on connection errors
on_error = true                  # Notify on general errors
